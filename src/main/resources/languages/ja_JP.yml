prefix: "<gradient:#FFAA00:#FF5555>[ClaritySkills]</gradient> <gray>"

general:
  no_permission: "<prefix><red>このコマンドを実行する権限がありません。"

stat:
  attack:
    name: "<red>攻撃力 (Attack)</red>"
    desc: "<gray>敵に与える物理ダメージを上昇させます。"
  magic:
    name: "<light_purple>魔力 (Magic)</light_purple>"
    desc: "<gray>魔法攻撃力とスキルの威力を向上させます。"
  defense:
    name: "<green>防御力 (Defense)</green>"
    desc: "<gray>受けるダメージを軽減します。"
  fire:
    name: "<gold>火属性 (Fire)</gold>"
    desc: "<gray>炎の力を操り、敵を炎上させ爆発を起こします。"
  wind:
    name: "<aqua>風属性 (Wind)</aqua>"
    desc: "<gray>突風の力をまとい、素早さと落下耐性を獲得します。"
  water:
    name: "<blue>水属性 (Water)</blue>"
    desc: "<gray>海流を呼び覚まし、水中生命力と凍結を付与します。"
  earth:
    name: "<dark_green>地属性 (Earth)</dark_green>"
    desc: "<gray>大地の堅牢な守りでノックバックを軽減します。"
  light:
    name: "<yellow>光属性 (Light)</yellow>"
    desc: "<gray>聖なる光の力でアンデッドを浄化し、回復をもたらします。"
  insufficient_points: "<prefix><red>スキルポイントが不足しています！必要: <yellow><required></yellow>, 所持: <gold><available></gold>。"
  max_reached: "<prefix><red>ステータス <stat> は既に最大レベルに達しています！"
  allocated: "<prefix><green><stat> に <yellow>+<amount></yellow> ポイント割り振りました！現在レベル: <gold><level></gold>。"

tier:
  none:
    name: "<dark_gray>なし</dark_gray>"
    desc: "<dark_gray>まだ属性階位は解放されていません。"
  fire:
    blaze:
      name: "<gold>ブレイズ階位 (Blaze)</gold>"
      desc: "<gray>攻撃ヒット時に相手を3秒間炎上させます。"
    inferno:
      name: "<red><bold>インフェルノ階位 (Inferno)</bold></red>"
      desc: "<gray>7秒間の炎上と+3の追加爆炎ダメージを与えます。"
  wind:
    badai:
      name: "<aqua>疾風階位 (Badai)</aqua>"
      desc: "<gray>落下ダメージを50%軽減し敏捷性を高めます。"
    storm:
      name: "<dark_aqua><bold>嵐神階位 (Storm)</bold></dark_aqua>"
      desc: "<gray>落下ダメージを完全無効化し嵐の疾走力を獲得します。"
  water:
    gelombang:
      name: "<blue>波涛階位 (Gelombang)</blue>"
      desc: "<gray>水中でイルカの好意と活力上昇を獲得します。"
    ice:
      name: "<aqua><bold>氷結階位 (Ice)</bold></aqua>"
      desc: "<gray>敵に極寒の凍結と移動速度低下を付与します。"
  earth:
    megalit:
      name: "<dark_green>巨石階位 (Megalit)</dark_green>"
      desc: "<gray>防具の耐久性とノックバック耐性を向上させます。"
    bumi:
      name: "<green><bold>大地階位 (Bumi)</bold></green>"
      desc: "<gray>体力が30%以下になると緊急耐性障壁を展開します。"
  light:
    suar:
      name: "<yellow>閃光階位 (Suar)</yellow>"
      desc: "<gray>アンデッドモンスターに対して+25%の聖なる特効ダメージを与えます。"
    foton:
      name: "<white><bold>光子階位 (Foton)</bold></white>"
      desc: "<gray>アンデッド特効+50%に加え、攻撃ヒット時に体力を回復します。"
  unlocked_title: "<yellow><bold>属性階位解放！</bold></yellow>"
  unlocked_subtitle: "<gray><element> の <tier> をマスターしました！"
  unlocked_broadcast: "<prefix><gold><player></gold> が <element> の <tier> を解放しました！"

level:
  max_reached: "<prefix><yellow>最大レベルに達しています！"
  up_title: "<gold><bold>レベルアップ！</bold></gold>"
  up_subtitle: "<gray>レベル <yellow><level></yellow> に到達！ +<points> ポイント獲得。"
  up_message: "<prefix><green>おめでとうございます！レベル <yellow><level></yellow> に到達し、<gold>+<points> スキルポイント</gold> を獲得しました！"

exp:
  received: "<prefix><green><yellow>+<amount> EXP</yellow> を獲得しました <gray>(ブースト: <aqua><multiplier></aqua>)。</gray>"

point:
  received: "<prefix><green><gold>+<amount> スキルポイント</gold> を獲得しました！"

boost:
  received: "<prefix><green><yellow><duration></yellow> の間、<gold><multiplier></gold> のEXPブーストを獲得しました！"
  global_broadcast: "<prefix><gold><bold>全体EXPブースト！</bold></gold> 全サーバーで <yellow><multiplier></yellow> 倍のEXPが <aqua><duration></aqua> 間有効です！"

dialog:
  general:
    btn_close: "閉じる"
    btn_back: "戻る"
    btn_confirm: "確定"
    btn_cancel: "キャンセル"
  main:
    title: "<bold>Clarity Skills</bold>"
    body: |
      <gray>現在のレベル:</gray> <white><level></white><dark_gray>/</dark_gray><white><max_level></white>

      <gray>EXP 進捗:</gray> <white><current_exp></white><dark_gray>/</dark_gray><white><req_exp></white> <dark_gray>[<aqua><exp_percent>%</aqua>]</dark_gray>

      <white>所持ポイント:</white> <gold><bold><points></bold></gold>
      <white>EXP ブースト:</white> <yellow><boost></yellow>

      <white>基本ステータス:</white>
      <gray> 攻撃:</gray> <white><atk></white>  <gray> 魔力:</gray> <white><matk></white>  <gray> 防御:</gray> <white><def></white>

      <white>属性ステータス:</white>
      <gray> 火:</gray> <white><fire></white>  <gray> 風:</gray> <white><wind></white>  <gray> 水:</gray> <white><water></white>
      <gray> 地:</gray> <white><earth></white>  <gray> 光:</gray> <white><light></white>
    btn_allocate: "ステータス割り振り"
    btn_allocate_tooltip: "<gray>スキルポイントを使って能力を強化します。"
    btn_elements: "属性階位一覧"
    btn_elements_tooltip: "<gray>属性階位のマイルストーンと特殊能力を確認します。"
  attributes:
    title: "<bold>ステータス割り振り</bold>"
    body: |
      <gray>強化したいステータスを選択してください。</gray>
      <gray>所持ポイント:</gray> <gold><bold><points></bold></gold>
    stat_entry: "<stat> [Lv <level>/<max>]"
  upgrade:
    title: "<bold>ステータス強化</bold>"
    body: |
      <stat>
      <gray><desc></gray>

      <gray>現在レベル:</gray> <white><level></white><dark_gray>/</dark_gray><gray><max></gray>
      <gray>必要ポイント:</gray> <yellow><cost> ポイント</yellow>
      <gray>所持ポイント:</gray> <gold><bold><points></bold></gold>
    btn_plus_1: "+1 ポイント"
    btn_plus_5: "+5 ポイント"
    btn_plus_10: "+10 ポイント"
    btn_custom: "自由入力..."
  custom:
    title: "<bold>カスタム割り振り</bold>"
    body: "<gray><stat> に割り振るポイント数を入力してください:</gray>"
    label: "ポイント数"
    invalid_amount: "<prefix><red>無効な数値です！正の整数を入力してください。"
  elements:
    title: "<bold>属性階位一覧</bold>"
    body: |
      <white>属性ステータスは高レベルに到達すると階位能力が解放されます。</white>

      <white>1. レベル <t1_req></white>
      <white>2. レベル <t2_req></white>
    entry: "<element> - <tier> (Lv <level>)"
    entry_tooltip: |
      <gray>解放条件:</gray>
      <gray>• <t1_name> (必要Lv <t1_req>)</gray>
      <gray>• <t2_name> (必要Lv <t2_req>)</gray>

command:
  skill:
    info: "<prefix><gray>レベル: <yellow><level></yellow> | EXP: <green><exp></green>/<req_exp> | ポイント: <gold><points></gold> | ブースト: <aqua><boost></aqua>"
    stats_header: "<prefix><gold><bold>=== あなたのステータス ===</bold></gold>"
    stat_core_entry: "<gray>• <stat>: <yellow><level></yellow>"
    stat_element_entry: "<gray>• <stat>: <yellow><level></yellow> <dark_gray>[<tier><dark_gray>]"
    help: "<prefix><gray><yellow>/skill</yellow> でスキルメニューを開くか、<yellow>/skill info</yellow> / <yellow>/skill stats</yellow> を使用してください。"
  admin:
    usage: "<prefix><red>使用法: <yellow><usage></yellow>"
    reloaded: "<prefix><green>ClaritySkills の設定と言語ファイルを再読み込みしました。"
    player_not_found: "<prefix><red>プレイヤー <yellow><player></yellow> はオフラインです。"
