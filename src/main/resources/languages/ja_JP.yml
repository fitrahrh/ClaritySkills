    exp_reset: "<prefix><green><gold><player></gold> の EXP を 0 にリセットしました。"
    point_given: "<prefix><green><yellow><player></yellow> に <gold><amount> スキルポイント</gold> を付与しました。"
    points_given: "<prefix><green><yellow><player></yellow> に <gold><amount> スキルポイント</gold> を付与しました。"
    point_taken: "<prefix><green><yellow><player></yellow> から <gold><amount> スキルポイント</gold> を減算しました。"
    points_taken: "<prefix><green><yellow><player></yellow> から <gold><amount> スキルポイント</gold> を減算しました。"
    point_set: "<prefix><green><yellow><player></yellow> のスキルポイントを <gold><amount></gold> に設定しました。"
    points_set: "<prefix><green><yellow><player></yellow> のスキルポイントを <gold><amount></gold> に設定しました。"
    point_reset: "<prefix><green><yellow><player></yellow> のスキルポイントを 0 にリセットしました。"
    points_reset: "<prefix><green><yellow><player></yellow> のスキルポイントを 0 にリセットしました。"
    boost_given: "<prefix><green><yellow><player></yellow> に <gold><multiplier></gold> 倍のEXPブーストを <aqua><duration></aqua> 間付与しました。"
    boost_cleared: "<prefix><green><yellow><player></yellow> の個人EXPブーストを解除しました。"
    boost_cleared_player: "<prefix><green><yellow><player></yellow> の個人EXPブーストを解除しました。"
    boost_global_set: "<prefix><green>全体EXPブースト <gold><multiplier></gold> 倍を <aqua><duration></aqua> 間設定しました。"
    boost_global_cleared: "<prefix><green>全体EXPブーストを解除しました。"
    boost_list_player: "<prefix><gray>プレイヤー <yellow><player></yellow> ブースト: <gold><multiplier></gold> <gray>(残り時間: <aqua><duration></aqua>)</gray>"
    boost_list_global: "<prefix><gray>グローバルブースト: <gold><multiplier></gold> <gray>(残り時間: <aqua><duration></aqua>)</gray>"
    level_set: "<prefix><green><yellow><player></yellow> のレベルを <gold><level></gold> に設定しました。"
    player_reset: "<prefix><green>プレイヤー <yellow><player></yellow> のデータを初期化しました (モード: <aqua><mode></aqua>)."
    help: |
      <prefix><gold><bold>ClaritySkills 管理者コマンド一覧:</bold></gold>
      <yellow>/skilladmin exp give <プレイヤー> <量> [ブースト: true|false]</yellow>
      <yellow>/skilladmin exp take <プレイヤー> <量></yellow>
      <yellow>/skilladmin exp set <プレイヤー> <量></yellow>
      <yellow>/skilladmin exp reset <プレイヤー></yellow>
      <yellow>/skilladmin point give <プレイヤー> <量></yellow>
      <yellow>/skilladmin point take <プレイヤー> <量></yellow>
      <yellow>/skilladmin point set <プレイヤー> <量></yellow>
      <yellow>/skilladmin point reset <プレイヤー></yellow>
      <yellow>/skilladmin boost give <プレイヤー> <倍率> <期間></yellow>
      <yellow>/skilladmin boost global <倍率> <期間></yellow>
      <yellow>/skilladmin boost clear <global|プレイヤー></yellow>
      <yellow>/skilladmin boost list [プレイヤー]</yellow>
      <yellow>/skilladmin level set <プレイヤー> <レベル></yellow>
      <yellow>/skilladmin reset <プレイヤー> [all|stats|points]</yellow>
      <yellow>/skilladmin reload</yellow>
