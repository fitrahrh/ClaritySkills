prefix: "<gradient:#FFAA00:#FF5555>[ClaritySkills]</gradient> <gray>"

general:
  no_permission: "<prefix><red>You do not have permission to execute this command."

stat:
  attack:
    name: "<red>Attack</red>"
    desc: "<gray>Increases physical damage dealt to opponents."
  magic:
    name: "<light_purple>Magic</light_purple>"
    desc: "<gray>Enhances magical power and spell potency."
  defense:
    name: "<green>Defense</green>"
    desc: "<gray>Reduces incoming damage taken from attacks."
  fire:
    name: "<gold>Fire</gold>"
    desc: "<gray>Commands flame power to burn enemies and spark explosions."
  wind:
    name: "<aqua>Wind</aqua>"
    desc: "<gray>Harnesses gales for enhanced agility and fall dampening."
  water:
    name: "<blue>Water</blue>"
    desc: "<gray>Channels oceanic flows for aquatic vigor and chilling frost."
  earth:
    name: "<dark_green>Earth</dark_green>"
    desc: "<gray>Forges rock-solid resilience and shields in dire moments."
  light:
    name: "<yellow>Light</yellow>"
    desc: "<gray>Invokes radiant holy energy that smites undead beings."
  insufficient_points: "<prefix><red>Not enough skill points! Required: <yellow><required></yellow>, Available: <gold><available></gold>."
  max_reached: "<prefix><red>Stat <stat> has already reached the maximum level!"
  allocated: "<prefix><green>Allocated <yellow>+<amount></yellow> points to <stat>! Current level: <gold><level></gold>."

tier:
  none:
    name: "<dark_gray>None</dark_gray>"
    desc: "<dark_gray>No elemental mastery unlocked yet."
  fire:
    blaze:
      name: "<gold>Blaze Tier</gold>"
      desc: "<gray>Ignites targets on hit for 3 seconds."
    inferno:
      name: "<red><bold>Inferno Tier</bold></red>"
      desc: "<gray>Ignites targets for 7 seconds with +3 fire burst damage."
  wind:
    badai:
      name: "<aqua>Badai Tier</aqua>"
      desc: "<gray>Reduces fall damage by 50% and provides agility."
    storm:
      name: "<dark_aqua><bold>Storm Tier</bold></dark_aqua>"
      desc: "<gray>Complete immunity to fall damage and tempest haste."
  water:
    gelombang:
      name: "<blue>Gelombang Tier</blue>"
      desc: "<gray>Enhanced vitality and dolphin grace in aquatic depths."
    ice:
      name: "<aqua><bold>Ice Tier</bold></aqua>"
      desc: "<gray>Inflicts freezing frost and Slowness to targets."
  earth:
    megalit:
      name: "<dark_green>Megalit Tier</dark_green>"
      desc: "<gray>Grants armor fortitude and knockback dampening."
    bumi:
      name: "<green><bold>Bumi Tier</bold></green>"
      desc: "<gray>Generates emergency Resistance barrier when below 30% HP."
  light:
    suar:
      name: "<yellow>Suar Tier</yellow>"
      desc: "<gray>Deals +25% holy smite damage against undead monsters."
    foton:
      name: "<white><bold>Foton Tier</bold></white>"
      desc: "<gray>Deals +50% holy smite damage and restores health on hit."
  unlocked_title: "<yellow><bold>TIER UNLOCKED!</bold></yellow>"
  unlocked_subtitle: "<gray>Mastered <tier> for <element>!"
  unlocked_broadcast: "<prefix><gold><player></gold> has unlocked <tier> in <element>!"

level:
  max_reached: "<prefix><yellow>You have already reached the maximum level!"
  up_title: "<gold><bold>LEVEL UP!</bold></gold>"
  up_subtitle: "<gray>Reached Level <yellow><level></yellow>! +<points> Points."
  up_message: "<prefix><green>Congratulations! You leveled up to <yellow><level></yellow> and earned <gold>+<points> Skill Points</gold>!"

exp:
  received: "<prefix><green>Earned <yellow>+<amount> EXP</yellow> <gray>(Boost: <aqua><multiplier></aqua>).</gray>"

point:
  received: "<prefix><green>You received <gold>+<amount> Skill Points</gold>!"

boost:
  received: "<prefix><green>You received an EXP Boost of <gold><multiplier></gold> for <yellow><duration></yellow>!"
  global_broadcast: "<prefix><gold><bold>GLOBAL BOOST!</bold></gold> <yellow><multiplier></yellow> EXP multiplier active for <aqua><duration></aqua>!"

dialog:
  general:
    btn_close: "<red>Close</red>"
    btn_back: "<yellow>Back</yellow>"
    btn_confirm: "<green>Confirm</green>"
    btn_cancel: "<red>Cancel</red>"
  main:
    title: "CLARITY SKILLS"
    body: |
      <gold><bold>Player Skill Overview</bold></gold>
      <gray>Level:</gray> <yellow><level></yellow> <dark_gray>/</dark_gray> <gray><max_level></gray>
      <gray>EXP:</gray> <green><current_exp></green> <dark_gray>/</dark_gray> <gray><req_exp></gray> <aqua>(<exp_percent>%)</aqua>
      <gray>Available Points:</gray> <gold><bold><points></bold></gold>
      <gray>Active EXP Boost:</gray> <light_purple><boost></light_purple>

      <yellow><bold>Core Attributes:</bold></yellow>
      <red>Attack (ATK):</red> <white><atk></white> | <light_purple>Magic (MATK):</light_purple> <white><matk></white> | <green>Defense (DEF):</green> <white><def></white>

      <aqua><bold>Elemental Attributes:</bold></aqua>
      <gold>Fire:</gold> <white><fire></white> | <aqua>Wind:</aqua> <white><wind></white> | <blue>Water:</blue> <white><water></white> | <dark_green>Earth:</dark_green> <white><earth></white> | <yellow>Light:</yellow> <white><light></white>
    btn_allocate: "<green><bold>Allocate Attributes</bold></green>"
    btn_allocate_tooltip: "<gray>Spend your skill points to upgrade attributes."
    btn_elements: "<aqua><bold>Elemental Masteries</bold></aqua>"
    btn_elements_tooltip: "<gray>View elemental tier milestones and special powers."
    btn_language: "<yellow>Language Settings</yellow>"
  attributes:
    title: "ATTRIBUTE ALLOCATION"
    body: "<gray>Select an attribute to allocate skill points.\nAvailable Points: <gold><bold><points></bold></gold>"
    stat_entry: "<stat> <dark_gray>[<yellow>Lvl <level><dark_gray>/<gray><max><dark_gray>]</dark_gray>"
  upgrade:
    title: "UPGRADE STAT"
    body: |
      <stat>
      <desc>
      <gray>Current Level:</gray> <yellow><level></yellow> <dark_gray>/</dark_gray> <gray><max></gray>
      <gray>Cost Per Point:</gray> <gold><cost> Point(s)</gold>
      <gray>Available Points:</gray> <gold><bold><points></bold></gold>
    btn_plus_1: "<green>+1 Point</green>"
    btn_plus_5: "<green>+5 Points</green>"
    btn_plus_10: "<green>+10 Points</green>"
    btn_custom: "<aqua>Custom Amount...</aqua>"
  custom:
    title: "CUSTOM ALLOCATION"
    body: "<gray>Enter the number of points to allocate into <stat>:"
    label: "Points Amount"
    invalid_amount: "<prefix><red>Invalid amount entered! Please specify a positive integer."
  elements:
    title: "ELEMENTAL MASTERIES"
    body: "<gray>Elemental attributes unlock special tiers at high levels:\n<yellow>Tier 1 Threshold:</yellow> Level 25\n<gold>Tier 2 Threshold:</gold> Level 50"
    entry: "<element> <dark_gray>-</dark_gray> <tier> <dark_gray>(Lvl <level>)</dark_gray>"
    entry_tooltip: "<gray>Milestones:\n<yellow>• <t1_name> (Req Lvl <t1_req>)\n<gold>• <t2_name> (Req Lvl <t2_req>)</gray>"

command:
  skill:
    info: "<prefix><gray>Level: <yellow><level></yellow> | EXP: <green><exp></green>/<req_exp> | Points: <gold><points></gold> | Boost: <aqua><boost></aqua>"
    stats_header: "<prefix><gold><bold>=== Your Attributes ===</bold></gold>"
    stat_core_entry: "<gray>• <stat>: <yellow><level></yellow>"
    stat_element_entry: "<gray>• <stat>: <yellow><level></yellow> <dark_gray>[<tier><dark_gray>]"
    help: "<prefix><gray>Use <yellow>/skill</yellow> to open the skill dialog menu, or <yellow>/skill info</yellow> / <yellow>/skill stats</yellow>."
  admin:
    reloaded: "<prefix><green>ClaritySkills configuration and language bundles reloaded."
    player_not_found: "<prefix><red>Player <yellow><player></yellow> was not found online."
    exp_given: "<prefix><green>Gave <yellow><amount> EXP</yellow> to <gold><player></gold> (Boost applied: <aqua><boosted></aqua>)."
    exp_taken: "<prefix><green>Removed <yellow><amount> EXP</yellow> from <gold><player></gold>."
    exp_set: "<prefix><green>Set EXP of <gold><player></gold> to <yellow><amount></yellow>."
    exp_reset: "<prefix><green>Reset EXP of <gold><player></gold> to 0."
    point_given: "<prefix><green>Gave <gold><amount> Skill Points</gold> to <yellow><player></yellow>."
    point_taken: "<prefix><green>Removed <gold><amount> Skill Points</gold> from <yellow><player></yellow>."
    point_set: "<prefix><green>Set Skill Points of <yellow><player></yellow> to <gold><amount></gold>."
    point_reset: "<prefix><green>Reset Skill Points of <yellow><player></yellow> to 0."
    boost_given: "<prefix><green>Gave <gold><multiplier></gold> EXP Boost to <yellow><player></yellow> for <aqua><duration></aqua>."
    boost_cleared_player: "<prefix><green>Cleared personal EXP Boost for <yellow><player></yellow>."
    boost_global_set: "<prefix><green>Global EXP Boost of <gold><multiplier></gold> set for <aqua><duration></aqua>."
    boost_global_cleared: "<prefix><green>Global EXP Boost has been cleared."
    level_set: "<prefix><green>Set level of <yellow><player></yellow> to <gold><level></gold>."
    player_reset: "<prefix><green>Reset player <yellow><player></yellow> (Mode: <aqua><mode></aqua>)."
    help: |
      <prefix><gold><bold>ClaritySkills Admin Help:</bold></gold>
      <yellow>/skilladmin exp give <player> <amount> [boost: true|false]</yellow>
      <yellow>/skilladmin exp take <player> <amount></yellow>
      <yellow>/skilladmin exp set <player> <amount></yellow>
      <yellow>/skilladmin exp reset <player></yellow>
      <yellow>/skilladmin point give <player> <amount></yellow>
      <yellow>/skilladmin point take <player> <amount></yellow>
      <yellow>/skilladmin point set <player> <amount></yellow>
      <yellow>/skilladmin point reset <player></yellow>
      <yellow>/skilladmin boost give <player> <multiplier> <duration></yellow>
      <yellow>/skilladmin boost global <multiplier> <duration></yellow>
      <yellow>/skilladmin boost clear <global|player></yellow>
      <yellow>/skilladmin boost list [player]</yellow>
      <yellow>/skilladmin level set <player> <level></yellow>
      <yellow>/skilladmin reset <player> [all|stats|points]</yellow>
      <yellow>/skilladmin reload</yellow>
