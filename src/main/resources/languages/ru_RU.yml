prefix: "<gradient:#FFAA00:#FF5555>[ClaritySkills]</gradient> <gray>"

general:
  no_permission: "<prefix><red>У вас недостаточно прав для выполнения этой команды."

stat:
  attack:
    name: "<red>Атака (Attack)</red>"
    desc: "<gray>Увеличивает физический урон, наносимый противникам."
  magic:
    name: "<light_purple>Магия (Magic)</light_purple>"
    desc: "<gray>Усиливает магическую силу и мощь заклинаний."
  defense:
    name: "<green>Защита (Defense)</green>"
    desc: "<gray>Снижает входящий урон от вражеских атак."
  fire:
    name: "<gold>Огонь (Fire)</gold>"
    desc: "<gray>Повелевает пламенем, поджигая цели и вызывая взрывы."
  wind:
    name: "<aqua>Ветер (Wind)</aqua>"
    desc: "<gray>Использует силу ветра для ловкости и снижения урона от падения."
  water:
    name: "<blue>Вода (Water)</blue>"
    desc: "<gray>Направляет силу океана для водной живучести и ледяного замедления."
  earth:
    name: "<dark_green>Земля (Earth)</dark_green>"
    desc: "<gray>Дарует несокрушимую броню и щиты в критические моменты."
  light:
    name: "<yellow>Свет (Light)</yellow>"
    desc: "<gray>Пробуждает священную силу, поражающую нежить и исцеляющую в бою."
  insufficient_points: "<prefix><red>Недостаточно очков навыков! Требуется: <yellow><required></yellow>, доступно: <gold><available></gold>."
  max_reached: "<prefix><red>Характеристика <stat> уже достигла максимального уровня!"
  allocated: "<prefix><green>Распределено <yellow>+<amount></yellow> очков в <stat>! Текущий уровень: <gold><level></gold>."

tier:
  none:
    name: "<dark_gray>Нет</dark_gray>"
    desc: "<dark_gray>Ступень стихии ещё не открыта."
  fire:
    blaze:
      name: "<gold>Ступень Blaze</gold>"
      desc: "<gray>Поджигает цели при ударе на 3 секунды."
    inferno:
      name: "<red><bold>Ступень Inferno</bold></red>"
      desc: "<gray>Поджигает на 7 секунд с дополнительным взрывным уроном +3."
  wind:
    badai:
      name: "<aqua>Ступень Badai</aqua>"
      desc: "<gray>Снижает урон от падения на 50% и повышает скорость передвижения."
    storm:
      name: "<dark_aqua><bold>Ступень Storm</bold></dark_aqua>"
      desc: "<gray>Полный иммунитет к урону от падения и стремительная скорость бури."
  water:
    gelombang:
      name: "<blue>Ступень Gelombang</blue>"
      desc: "<gray>Повышенная живучесть и грация дельфина в водных глубинах."
    ice:
      name: "<aqua><bold>Ступень Ice</bold></aqua>"
      desc: "<gray>Накладывает на врагов замедление и ледяное обморожение."
  earth:
    megalit:
      name: "<dark_green>Ступень Megalit</dark_green>"
      desc: "<gray>Увеличивает прочность брони и сопротивление отбрасыванию."
    bumi:
      name: "<green><bold>Ступень Bumi</bold></green>"
      desc: "<gray>Активирует защитный барьер Сопротивления при здоровье ниже 30%."
  light:
    suar:
      name: "<yellow>Ступень Suar</yellow>"
      desc: "<gray>Наносит +25% святого урона по монстрам-нежити."
    foton:
      name: "<white><bold>Ступень Foton</bold></white>"
      desc: "<gray>Наносит +50% святого урона по нежити и восстанавливает здоровье при ударе."
  unlocked_title: "<yellow><bold>СТУПЕНЬ ОТКРЫТА!</bold></yellow>"
  unlocked_subtitle: "<gray>Освоена <tier> для стихии <element>!"
  unlocked_broadcast: "<prefix><gold><player></gold> открыл <tier> стихии <element>!"

level:
  max_reached: "<prefix><yellow>Вы уже достигли максимального уровня!"
  up_title: "<gold><bold>НОВЫЙ УРОВЕНЬ!</bold></gold>"
  up_subtitle: "<gray>Достигнут <yellow><level></yellow> уровень! +<points> очков."
  up_message: "<prefix><green>Поздравляем! Вы повысили уровень до <yellow><level></yellow> и получили <gold>+<points> очков навыков</gold>!"

exp:
  received: "<prefix><green>Получено <yellow>+<amount> опыта</yellow> <gray>(Буст: <aqua><multiplier></aqua>).</gray>"

point:
  received: "<prefix><green>Вы получили <gold>+<amount> очков навыков</gold>!"

boost:
  received: "<prefix><green>Вы получили буст опыта <gold><multiplier></gold> на <yellow><duration></yellow>!"
  global_broadcast: "<prefix><gold><bold>ОБЩИЙ БУСТ ОПЫТА!</bold></gold> Множитель опыта <yellow><multiplier></yellow> активен на <aqua><duration></aqua>!"

dialog:
  general:
    btn_close: "Закрыть"
    btn_back: "Назад"
    btn_confirm: "Подтвердить"
    btn_cancel: "Отмена"
  main:
    title: "<bold>Clarity Skills</bold>"
    body: |
      <gray>Ваш уровень:</gray> <white><level></white><dark_gray>/</dark_gray><white><max_level></white>

      <gray>Прогресс опыта:</gray> <white><current_exp></white><dark_gray>/</dark_gray><white><req_exp></white> <dark_gray>[<aqua><exp_percent>%</aqua>]</dark_gray>

      <white>Свободные очки:</white> <gold><bold><points></bold></gold>
      <white>Активный буст:</white> <yellow><boost></yellow>

      <white>Основные характеристики:</white>
      <gray> Атака:</gray> <white><atk></white>  <gray> Магия:</gray> <white><matk></white>  <gray> Защита:</gray> <white><def></white>

      <white>Стихийные характеристики:</white>
      <gray> Огонь:</gray> <white><fire></white>  <gray> Ветер:</gray> <white><wind></white>  <gray> Вода:</gray> <white><water></white>
      <gray> Земля:</gray> <white><earth></white>  <gray> Свет:</gray> <white><light></white>
    btn_allocate: "Распределить очки"
    btn_allocate_tooltip: "<gray>Потратьте очки навыков на улучшение характеристик."
    btn_elements: "Ступени стихий"
    btn_elements_tooltip: "<gray>Просмотр этапов стихий и особых способностей."
  attributes:
    title: "<bold>Распределение Очков</bold>"
    body: |
      <gray>Выберите характеристику для распределения очков.</gray>
      <gray>Доступно очков:</gray> <gold><bold><points></bold></gold>
    stat_entry: "<stat> [Ур. <level>/<max>]"
  upgrade:
    title: "<bold>Улучшение Характеристики</bold>"
    body: |
      <stat>
      <gray><desc></gray>

      <gray>Текущий уровень:</gray> <white><level></white><dark_gray>/</dark_gray><gray><max></gray>
      <gray>Стоимость за уровень:</gray> <yellow><cost> очк.</yellow>
      <gray>Доступно очков:</gray> <gold><bold><points></bold></gold>
    btn_plus_1: "+1 очко"
    btn_plus_5: "+5 очков"
    btn_plus_10: "+10 очков"
    btn_custom: "Своё количество..."
  custom:
    title: "<bold>Выборочное Распределение</bold>"
    body: "<gray>Введите количество очков для вложения в <stat>:</gray>"
    label: "Количество очков"
    invalid_amount: "<prefix><red>Введено неверное число! Укажите положительное целое число."
  elements:
    title: "<bold>Ступени Стихий</bold>"
    body: |
      <white>Стихийные характеристики открывают особые ступени на высоких уровнях.</white>

      <white>1. Уровень <t1_req></white>
      <white>2. Уровень <t2_req></white>
    entry: "<element> - <tier> (Ур. <level>)"
    entry_tooltip: |
      <gray>Требования:</gray>
      <gray>• <t1_name> (Треб. ур. <t1_req>)</gray>
      <gray>• <t2_name> (Треб. ур. <t2_req>)</gray>

command:
  skill:
    info: "<prefix><gray>Уровень: <yellow><level></yellow> | Опыт: <green><exp></green>/<req_exp> | Очки: <gold><points></gold> | Буст: <aqua><boost></aqua>"
    stats_header: "<prefix><gold><bold>=== Ваши характеристики ===</bold></gold>"
    stat_core_entry: "<gray>• <stat>: <yellow><level></yellow>"
    stat_element_entry: "<gray>• <stat>: <yellow><level></yellow> <dark_gray>[<tier><dark_gray>]"
    help: "<prefix><gray>Используйте <yellow>/skill</yellow> для открытия меню, либо <yellow>/skill info</yellow> / <yellow>/skill stats</yellow>."
  admin:
    usage: "<prefix><red>Использование: <yellow><usage></yellow>"
    reloaded: "<prefix><green>Конфигурация и языковые файлы ClaritySkills успешно перезагружены."
    player_not_found: "<prefix><red>Игрок <yellow><player></yellow> не найден в сети."
    exp_given: "<prefix><green>Выдано <yellow><amount> опыта</yellow> игроку <gold><player></gold> (Буст: <aqua><boosted></aqua>)."
    exp_taken: "<prefix><green>Снято <yellow><amount> опыта</yellow> у игрока <gold><player></gold>."
    exp_set: "<prefix><green>Установлен опыт игрока <gold><player></gold> на <yellow><amount></yellow>."
    exp_reset: "<prefix><green>Опыт игрока <gold><player></gold> сброшен до 0."
    point_given: "<prefix><green>Выдано <gold><amount> очков навыков</gold> игроку <yellow><player></yellow>."
    points_given: "<prefix><green>Выдано <gold><amount> очков навыков</gold> игроку <yellow><player></yellow>."
    point_taken: "<prefix><green>Снято <gold><amount> очков навыков</gold> у игрока <yellow><player></yellow>."
    points_taken: "<prefix><green>Снято <gold><amount> очков навыков</gold> у игрока <yellow><player></yellow>."
    point_set: "<prefix><green>Установлено очков навыков игрока <yellow><player></yellow> на <gold><amount></gold>."
    points_set: "<prefix><green>Установлено очков навыков игрока <yellow><player></yellow> на <gold><amount></gold>."
    point_reset: "<prefix><green>Очки навыков игрока <yellow><player></yellow> сброшены до 0."
    points_reset: "<prefix><green>Очки навыков игрока <yellow><player></yellow> сброшены до 0."
    boost_given: "<prefix><green>Выдан буст опыта <gold><multiplier></gold> игроку <yellow><player></yellow> на <aqua><duration></aqua>."
    boost_cleared: "<prefix><green>Личный буст опыта снят с игрока <yellow><player></yellow>."
    boost_cleared_player: "<prefix><green>Личный буст опыта снят с игрока <yellow><player></yellow>."
    boost_global_set: "<prefix><green>Общий буст опыта <gold><multiplier></gold> установлен на <aqua><duration></aqua>."
    boost_global_cleared: "<prefix><green>Общий буст опыта очищен."
    boost_list_player: "<prefix><gray>Буст Игрока <yellow><player></yellow>: <gold><multiplier></gold> <gray>(Осталось: <aqua><duration></aqua>)</gray>"
    boost_list_global: "<prefix><gray>Глобальный Буст: <gold><multiplier></gold> <gray>(Осталось: <aqua><duration></aqua>)</gray>"
    level_set: "<prefix><green>Уровень игрока <yellow><player></yellow> установлен на <gold><level></gold>."
    player_reset: "<prefix><green>Данные игрока <yellow><player></yellow> сброшены (Режим: <aqua><mode></aqua>)."
    help: |
      <prefix><gold><bold>Справка администратора ClaritySkills:</bold></gold>
      <yellow>/skilladmin exp give <игрок> <кол-во> [буст: true|false]</yellow>
      <yellow>/skilladmin exp take <игрок> <кол-во></yellow>
      <yellow>/skilladmin exp set <игрок> <кол-во></yellow>
      <yellow>/skilladmin exp reset <игрок></yellow>
      <yellow>/skilladmin point give <игрок> <кол-во></yellow>
      <yellow>/skilladmin point take <игрок> <кол-во></yellow>
      <yellow>/skilladmin point set <игрок> <кол-во></yellow>
      <yellow>/skilladmin point reset <игрок></yellow>
      <yellow>/skilladmin boost give <игрок> <множитель> <время></yellow>
      <yellow>/skilladmin boost global <множитель> <время></yellow>
      <yellow>/skilladmin boost clear <global|игрок></yellow>
      <yellow>/skilladmin boost list [игрок]</yellow>
      <yellow>/skilladmin level set <игрок> <уровень></yellow>
      <yellow>/skilladmin reset <игрок> [all|stats|points]</yellow>
      <yellow>/skilladmin reload</yellow>
