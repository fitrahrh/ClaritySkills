name: ClaritySkills
version: '${version}'
main: com.harukiyu.clarityskills.ClaritySkills
api-version: '1.21'
description: Advanced RPG Skill & Attribute Addon for Paper 26.3
authors: [Harukiyu]
dependencies:
  server:
    ClarityLangCore:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false

permissions:
  clarityskills.use:
    description: Allows using /skill
    default: true
  clarityskills.admin:
    description: Allows using /skilladmin
    default: op
